name: Package Business OS toolchain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.ref == 'tooling/business-os-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out helper branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.13.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.15.1

      - name: Package portable toolchain
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/business-os-toolchain
          rm -rf "$root"
          mkdir -p "$root"

          node_bin="$(readlink -f "$(command -v node)")"
          node_root="$(dirname "$(dirname "$node_bin")")"
          pnpm_home="${PNPM_HOME:-$(dirname "$(command -v pnpm)")}" 
          pnpm_install_root="$(dirname "$(dirname "$pnpm_home")")"

          printf 'node=%s\nnode_root=%s\npnpm_home=%s\npnpm_install_root=%s\n' \
            "$node_bin" "$node_root" "$pnpm_home" "$pnpm_install_root"

          cp -a "$node_root" "$root/node"
          cp -a "$pnpm_install_root" "$root/pnpm-install"
          cat > "$root/pnpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          toolchain="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$toolchain/node/bin:$PATH"
          exec "$toolchain/pnpm-install/node_modules/.bin/pnpm" "$@"
          SH
          chmod +x "$root/pnpm"

          "$root/node/bin/node" --version
          "$root/pnpm" --version
          tar -C /tmp -czf /tmp/business-os-toolchain.tgz business-os-toolchain
          sha256sum /tmp/business-os-toolchain.tgz
          du -h /tmp/business-os-toolchain.tgz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: business-os-node24-pnpm11
          path: /tmp/business-os-toolchain.tgz
          retention-days: 1
