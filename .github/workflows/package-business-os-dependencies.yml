name: Package Business OS dependency store

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.ref == 'tooling/business-os-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out helper branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.13.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.15.1

      - name: Populate portable dependency store
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/business-os-dependencies
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          printf '{"name":"business-os-public-dependency-cache","private":true,"packageManager":"pnpm@11.15.1"}\n' > package.json
          pnpm add --save-exact \
            @axe-core/playwright@4.12.1 \
            @base-ui/react@1.6.0 \
            @better-auth/api-key@1.6.23 \
            @better-auth/drizzle-adapter@1.6.23 \
            @fontsource-variable/geist@5.3.0 \
            @playwright/test@1.61.1 \
            @tailwindcss/postcss@4.3.3 \
            @testcontainers/postgresql@12.0.4 \
            @types/node@24.13.3 \
            @types/pg@8.20.0 \
            @types/react@19.2.17 \
            @types/react-dom@19.2.3 \
            @vercel/otel@2.1.3 \
            better-auth@1.6.23 \
            class-variance-authority@0.7.1 \
            clsx@2.1.1 \
            commander@15.0.0 \
            decimal.js@10.6.0 \
            drizzle-kit@0.31.10 \
            drizzle-orm@0.45.2 \
            esbuild@0.28.1 \
            eslint@9.39.5 \
            eslint-config-next@16.2.10 \
            eslint-config-prettier@10.1.8 \
            lucide-react@1.25.0 \
            next@16.2.10 \
            pg@8.22.0 \
            pg-boss@12.24.1 \
            postcss@8.5.20 \
            posthog-js@1.404.1 \
            prettier@3.9.5 \
            react@19.2.7 \
            react-dom@19.2.7 \
            react-markdown@10.1.0 \
            remark-gfm@4.0.1 \
            tailwind-merge@3.6.0 \
            tailwindcss@4.3.3 \
            tsx@4.23.1 \
            turbo@2.10.5 \
            typescript@6.0.3 \
            uuid@14.0.1 \
            vitest@4.1.10 \
            zod@4.4.3 \
            zod-openapi@6.0.0
          store="$(pnpm store path)"
          printf 'store=%s\n' "$store"
          tar -C "$(dirname "$store")" -czf /tmp/business-os-pnpm-store.tgz "$(basename "$store")"
          sha256sum /tmp/business-os-pnpm-store.tgz
          du -h /tmp/business-os-pnpm-store.tgz

      - name: Upload dependency store
        uses: actions/upload-artifact@v4
        with:
          name: business-os-pnpm-store-linux-x64
          path: /tmp/business-os-pnpm-store.tgz
          retention-days: 1
