name: Package Business OS dependency store

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.ref == 'tooling/business-os-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out helper branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.13.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.15.1

      - name: Populate exact lockfile dependency store
        id: populate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            work=/tmp/business-os-dependencies
            rm -rf "$work"
            mkdir -p "$work"
            base64 --decode .github/tooling/business-os-lockfile-cache.package.json.gz.b64 \
              | gzip --decompress > "$work/package.json"
            cd "$work"
            pnpm install --ignore-scripts --force
            store="$(pnpm store path)"
            printf 'store=%s\n' "$store"
            tar -C "$(dirname "$store")" -czf /tmp/business-os-pnpm-store.tgz "$(basename "$store")"
            sha256sum /tmp/business-os-pnpm-store.tgz
            du -h /tmp/business-os-pnpm-store.tgz
          } 2>&1 | tee /tmp/business-os-dependencies.log

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-os-lockfile-store-diagnostics
          path: |
            /tmp/business-os-dependencies.log
            /tmp/business-os-dependencies/pnpm-lock.yaml
          retention-days: 1

      - name: Upload exact dependency store
        if: steps.populate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: business-os-lockfile-pnpm-store-linux-x64
          path: /tmp/business-os-pnpm-store.tgz
          retention-days: 1

      - name: Fail when dependency packaging failed
        if: steps.populate.outcome == 'failure'
        run: exit 1
